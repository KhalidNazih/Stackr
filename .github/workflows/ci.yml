name: CI - Linting, Validation & Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  k8s-validation:
    name: Kubernetes & Helm Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Validate Kustomize Base & Overlays
        run: |
          echo "Validating BaseServices/overlays/admin..."
          kubectl kustomize BaseServices/overlays/admin > /dev/null
          echo "Validating BaseServices/overlays/admin_with_ui..."
          kubectl kustomize BaseServices/overlays/admin_with_ui > /dev/null
          echo "✅ Kustomize overlays compiled successfully!"

      - name: Lint Tenant Blueprint Helm Chart
        run: |
          echo "Linting templates/tenant-blueprint..."
          helm lint templates/tenant-blueprint
          echo "Testing template rendering with customer-01.yaml..."
          helm template test-release templates/tenant-blueprint -f registry/customer-01.yaml > /dev/null
          echo "✅ Helm chart validated successfully!"

  backend-validation:
    name: Backend API Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax and Import Check
        run: |
          python -m compileall .
          python -c "import main; print('FastAPI app initialized successfully')"
        env:
          KEYCLOAK_INTERNAL_URL: "http://localhost:8080"
          KEYCLOAK_CLIENT_SECRET: "test-secret"
          GITLAB_URL: "http://localhost:80"
          GITLAB_TOKEN: "test-token"
          ARGOCD_URL: "http://localhost:8080"
          ARGOCD_TOKEN: "test-token"
          KUBE_API_URL: "http://localhost:6443"
          KUBE_TOKEN: "test-token"

  webui-validation:
    name: Developer Portal WebUI Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/webui
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/webui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

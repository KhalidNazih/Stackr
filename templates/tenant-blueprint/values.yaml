# ==============================================================================
# Stackr Tenant Blueprint Helm Chart — Default Values
# ==============================================================================
# This chart synthesizes an isolated multi-tenant environment containing
# configurable toolchains (Jenkins, GitLab, Nexus, SonarQube) mapped to
# centralized Keycloak OIDC/SAML authentication and OpenBao secret storage.
# ==============================================================================

tenant_id: "default-tenant"
display_name: "Default Platform Tenant"
business_unit: "Platform"
environment: "dev"
cost_center: "engineering"

infrastructure:
  cluster_server: "https://kubernetes.default.svc"

isolation:
  namespace: "default-tenant-ns"

platform:
  public_base_url: "http://<YOUR_TAILSCALE_IP>.nip.io"
  keycloak:
    internal_url: "http://keycloak.admin:8080"
    public_url: "http://keycloak.<YOUR_TAILSCALE_IP>.nip.io"
    realm: "Devsecops_Platform_Users"
  secrets:
    name: "default-tenant-secrets"
    data:
      gitlab_root_password: "ChangeMeRoot123!"

services:
  jenkins:
    enabled: true
    node_port: 30101
    client_id: "Jenkins"
    replicas: 1
    size: "medium"
  gitlab:
    enabled: false
    node_port: 30102
    client_id: "Gitlab"
    replicas: 1
    size: "medium"
  nexus:
    enabled: false
    node_port: 31083
    client_id: "nexus"
    replicas: 1
    size: "medium"
  sonarqube:
    enabled: false
    node_port: 32410
    client_id: "sonarqube"
    replicas: 1
    size: "medium"

access:
  groups:
    admins: "default-tenant-admins"
    users: "default-tenant-users"
    developers:
      - "developer@example.com"
  creator_email: "admin@example.com"

{{- if or .Values.services.jenkins.enabled .Values.services.gitlab.enabled .Values.services.nexus.enabled .Values.services.sonarqube.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.tenant_id }}-ingress
  namespace: {{ .Values.isolation.namespace }}
spec:
  ingressClassName: nginx
  rules:
    {{- if .Values.services.jenkins.enabled }}
    - host: jenkins-{{ .Values.tenant_id }}.{{ trimPrefix "http://" (trimPrefix "https://" .Values.platform.public_base_url) }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ .Values.tenant_id }}-jenkins
              port:
                number: 8080
    {{- end }}
    {{- if .Values.services.gitlab.enabled }}
    - host: git-{{ .Values.tenant_id }}.{{ trimPrefix "http://" (trimPrefix "https://" .Values.platform.public_base_url) }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ .Values.tenant_id }}-gitlab
              port:
                number: 80
    {{- end }}
    {{- if .Values.services.nexus.enabled }}
    - host: nexus-{{ .Values.tenant_id }}.{{ trimPrefix "http://" (trimPrefix "https://" .Values.platform.public_base_url) }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ .Values.tenant_id }}-nexus
              port:
                number: 80
    {{- end }}
    {{- if .Values.services.sonarqube.enabled }}
    - host: sonar-{{ .Values.tenant_id }}.{{ trimPrefix "http://" (trimPrefix "https://" .Values.platform.public_base_url) }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ .Values.tenant_id }}-sonarqube
              port:
                number: 9000
    {{- end }}
{{- end }}

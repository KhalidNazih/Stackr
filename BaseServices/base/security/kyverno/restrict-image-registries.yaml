apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-registries
      match:
        any:
        - resources:
            kinds:
              - Pod
      exclude:
        any:
        - resources:
            namespaces:
            - kube-system
            - kyverno
            - admin
            - tailscale
            - ingress-basic
            - argocd
      validate:
        message: "Unknown image registry. You must use <YOUR_PRIVATE_REGISTRY>."
        pattern:
          spec:
            containers:
            - image: "<YOUR_PRIVATE_REGISTRY>/*"

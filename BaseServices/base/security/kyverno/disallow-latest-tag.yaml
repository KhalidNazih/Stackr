apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
        - resources:
            kinds:
              - Pod
      exclude:
        any:
        - resources:
            namespaces:
            - kube-system
            - kyverno
            - admin
            - tailscale
            - ingress-basic
            - argocd
      validate:
        message: "You cannot use the ':latest' tag! You must specify an exact version (e.g., :v2)."
        pattern:
          spec:
            containers:
            - image: "!*:latest"

apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: block-reverse-shells
spec:
  podSelector:
    matchExpressions:
    - key: "role"
      operator: "NotIn"
      values: ["admin-debug", "core-system"]
  lsmhooks:
  - hook: "bprm_check"
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/bin/bash"
        - "/bin/sh"
        - "/usr/bin/bash"
        - "/usr/bin/sh"
      matchActions:
      - action: Sigkill

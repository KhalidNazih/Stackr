apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "lsm-file-open"
spec:
  podSelector:
    matchExpressions:
    - key: "role"
      operator: "NotIn"
      values: ["admin-debug", "core-system"]
  kprobes:
  - call: "sys_openat"
    syscall: true
    args:
      - index: 0
        type: "int"
      - index: 1
        type: "string"
    selectors:
    - matchBinaries:
      - operator: "In"
        values:
        - "/usr/bin/cat"
        - "/usr/bin/tail"
        - "/usr/bin/less"
        - "/bin/cat"
        - "/bin/tail"
        - "/bin/less"
      matchArgs:
      - index: 1
        operator: "Equal"
        values:
        - "/etc/passwd"
        - "/etc/shadow"
        - "/etc/kubernetes/pki/ca.crt"
      matchActions:                
       - action: Sigkill
